name: UI Tests & Allure Report

on:
  # Позволяет запускать тесты вручную из вкладки Actions
  workflow_dispatch:
  # Оставляю push, если захочешь автоматику, но ты можешь просто удалить эти строки
  # push:
  #   branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x' # Используй актуальную версию твоего проекта (8.0, 9.0 или 10.0)

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Tests
        # Добавляем флаг --results-directory для уверенности, где лежат отчеты
        run: dotnet test --no-restore --verbosity normal
        continue-on-error: true

      - name: Get Allure history
        uses: actions/checkout@v3
        if: always()
        continue-on-error: true # Не падает, если ветки gh-pages еще нет
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history